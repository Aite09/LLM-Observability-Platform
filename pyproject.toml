[project]
name = "llm-observability"
version = "0.1.0"
description = "Production-grade LLM Evaluation & Observability Platform"
requires-python = ">=3.11"

dependencies = [
    # API
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    # DB — async stack
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    # Config
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    # Queue
    "redis>=5.0.0",
    "rq>=1.16.0",
    # LLM + embeddings
    "anthropic>=0.34.0",
    "fastembed>=0.3.0",
    # pgvector Python client
    "pgvector>=0.3.0",
    # Async HTTP (webhooks)
    "httpx>=0.27.0",
    # Observability
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24.0",
    "opentelemetry-instrumentation-sqlalchemy>=0.45b0",
    "prometheus-fastapi-instrumentator>=6.1.0",
    # Numerics (drift detection)
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",    # AsyncClient for FastAPI TestClient
    "anyio>=4.4.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "eval*", "monitor*", "workers*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["api", "eval", "monitor", "workers"]
omit = ["*/migrations/*", "*/tests/*"]
